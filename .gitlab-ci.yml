stages:
  - build
  - push
  - deploy

variables:  
  CI_REGISTRY: "registry.gitlab.com"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA


before_script:
  # Устанавливаем Helm и Kubernetes CLI (kubectl)
  - apk add --no-cache curl
  - echo $HELM_ACCESS_TOKEN
  - export HELM_VERSION=v3.8.0
  - curl https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz -o helm.tar.gz
  - tar -zxvf helm.tar.gz
  - mv linux-amd64/helm /usr/local/bin/helm
  - helm version
  - kubectl version
  - mkdir -p ~/.kube
  - echo "$KUBERNETES_CONFIG" | base64 -d > ~/.kube/config

build-job:
  stage: build
  script:
    # Собираем Docker образ из Dockerfile
    - docker build -t $DOCKER_IMAGE:$IMAGE_TAG .

push-job:
  stage: push
  script:
    # Входим в GitLab Container Registry
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

    # Пушим образ в реестр GitLab
    - docker push $DOCKER_IMAGE:$IMAGE_TAG

